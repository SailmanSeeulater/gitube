# Goes to /etc/nginx/snippets/repo-garden-headers.conf on the VPS.
#
# Security headers for repo-garden, included at server level and again in
# every location that sets its own add_header (nginx drops the inherited set
# in a location that declares one). Edit them here, once.

add_header X-Content-Type-Options nosniff always;
add_header X-Frame-Options DENY always;
add_header Referrer-Policy strict-origin-when-cross-origin always;
add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

# Vite emits module scripts only, so script-src needs no 'unsafe-inline';
# style-src keeps it for React style attributes and the graph's tooltip.
# Avatar images aside, the browser talks to two outside hosts. The GitHub
# API (api.github.com) is the only one that ever gets the visitor's token.
# The Umami tracker's script comes from stats.latesailor.dev and reports
# page and event counts back to it; the tracker gets no token, no query
# string and no URL path (see README, "Analytics"). Requests made from
# script (fetch and XHR, under connect-src) can reach no other host, so this
# policy, with src/analytics/umami.ts, keeps the token on api.github.com.
# Allowing the tracker's script means trusting that server as much as this
# one: whatever it serves runs in the page. Contributor avatars are plain
# images from avatars.githubusercontent.com (no token is sent to img-src
# hosts). Links out to github.com are navigation, which CSP does not
# restrict.
add_header Content-Security-Policy "default-src 'self'; base-uri 'self'; frame-ancestors 'none'; form-action 'self'; object-src 'none'; script-src 'self' https://stats.latesailor.dev; style-src 'self' 'unsafe-inline'; img-src 'self' data: https://avatars.githubusercontent.com; font-src 'self'; connect-src 'self' https://api.github.com https://stats.latesailor.dev" always;
