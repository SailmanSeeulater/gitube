# Goes to /etc/nginx/snippets/repo-garden-headers.conf on the VPS.
#
# Security headers for repo-garden, included at server level and again in
# every location that sets its own add_header (nginx drops the inherited set
# in a location that declares one). Edit them here, once.

add_header X-Content-Type-Options nosniff always;
add_header X-Frame-Options DENY always;
add_header Referrer-Policy strict-origin-when-cross-origin always;
add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

# Vite emits module scripts only, so script-src needs no 'unsafe-inline';
# style-src keeps it for React style attributes and the graph's tooltip.
# The app's one outside call is the GitHub REST API, made from the browser,
# so api.github.com is the only extra host. The visitor's token goes there
# and nowhere else; this policy is what guarantees it. Links out to
# github.com are navigation, which CSP does not restrict.
add_header Content-Security-Policy "default-src 'self'; base-uri 'self'; frame-ancestors 'none'; form-action 'self'; object-src 'none'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; connect-src 'self' https://api.github.com" always;
