# Goes to /etc/nginx/sites-available/repo-garden on the VPS, then
# `sudo certbot --nginx -d repogarden.latesailor.dev` adds the 443 block
# and the 80 -> 443 redirect to this file.

server {
    listen 80;
    listen [::]:80;
    server_name repogarden.latesailor.dev;

    # Filled by .github/workflows/deploy.yml (rsync of dist/).
    root /var/www/repo-garden;
    index index.html;

    include /etc/nginx/snippets/repo-garden-headers.conf;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;

    # Vite hashes everything in /assets/, so a file never changes under its name.
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        include /etc/nginx/snippets/repo-garden-headers.conf;
        try_files $uri =404;
    }

    # The entry point is what points at the hashed files, so always revalidate it.
    location = /index.html {
        add_header Cache-Control "no-cache";
        include /etc/nginx/snippets/repo-garden-headers.conf;
    }

    # Single-page app: unknown paths get the app, not a 404.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
