# Goes to /etc/nginx/sites-available/repo-garden on the VPS, in place of the old
# site, once gitube.latesailor.dev is live (DEPLOY.md, "Moving from
# repogarden.latesailor.dev"). Then `sudo certbot --nginx -d repogarden.latesailor.dev`
# adds the 443 block, which keeps the same redirect.
#
# The app's old address sends every request on to the new one, path and query
# string included, so a share link posted before the move (?repo=..., ?user=...)
# still opens the same repo or person. 301: browsers and search engines move to
# the new address for good.

server {
    listen 80;
    listen [::]:80;
    server_name repogarden.latesailor.dev;

    return 301 https://gitube.latesailor.dev$request_uri;
}
